{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="card-h"><h3 data-i18n="pta_events"></h3><span class="sub" data-i18n="pta_events_sub"></span></div>
  <div class="events" id="events"><div class="skel" style="min-height:48px;width:100%"></div></div>
</section>

<section class="row cols-4" id="res-kpis">
  <div class="card kpi acc"><div class="label" data-i18n="m"></div><div class="value"><span id="r-m">—</span><span class="unit" id="r-m-u">psi/cycle</span></div><div class="foot" id="r-m-a"></div></div>
  <div class="card kpi acc"><div class="label" data-i18n="k"></div><div class="value"><span id="r-k">—</span><span class="unit">mD</span></div><div class="foot" id="r-k-a"></div></div>
  <div class="card kpi acc"><div class="label" data-i18n="s"></div><div class="value"><span id="r-s">—</span></div><div class="foot" id="r-s-a"></div></div>
  <div class="card kpi acc"><div class="label" data-i18n="dps"></div><div class="value"><span id="r-dps">—</span><span class="unit" data-i18n="psi">psi</span></div><div class="foot" id="r-dps-a"></div></div>
</section>

<section class="row cols-2">
  <div class="card"><div class="card-h"><h3 data-i18n="history"></h3></div><div class="chart" id="c-hist"></div></div>
  <div class="card"><div class="card-h"><h3 data-i18n="loglog"></h3><span class="sub" data-i18n="loglog_hint"></span></div><div class="chart" id="c-loglog"></div></div>
  <div class="card"><div class="card-h"><h3 data-i18n="horner"></h3></div><div class="chart" id="c-horner"></div></div>
  <div class="card">
    <div class="card-h"><h3 data-i18n="results"></h3><div class="right"><span class="badge" id="mode-badge"></span><span class="badge" id="q-badge"></span></div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <span class="eyebrow" data-i18n="window"></span>
      <input type="number" id="w0" step="0.1" min="0.01" style="width:90px"> <span class="dim" data-i18n="to"></span>
      <input type="number" id="w1" step="0.1" min="0.02" style="width:90px"> <span class="dim" data-i18n="hours"></span>
      <button class="btn" id="apply"><span data-i18n="apply"></span></button>
      <button class="btn ghost" id="auto" data-icon="refresh"><span data-i18n="auto"></span></button>
    </div>
    <div class="kv" id="extra"></div>
    <div class="eyebrow" style="margin:16px 0 8px" data-i18n="interpretation"></div>
    <div class="interp" id="interp"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/pta.js') }}"></script>{% endblock %}
