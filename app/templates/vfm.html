{% extends "base.html" %}
{% block content %}
<section class="row cols-4">
  <div class="card kpi oil"><div class="label"><span class="swatch" style="background:var(--oil)"></span><span data-i18n="oil"></span> · <span data-i18n="period_total"></span></div><div class="value"><span id="t-oil">—</span><span class="unit" id="t-oil-u">Mstb</span></div><div class="foot" id="t-oil-f"></div></div>
  <div class="card kpi water"><div class="label"><span class="swatch" style="background:var(--water)"></span><span data-i18n="water"></span> · <span data-i18n="period_total"></span></div><div class="value"><span id="t-water">—</span><span class="unit" id="t-water-u">Mstb</span></div><div class="foot" id="t-water-f"></div></div>
  <div class="card kpi gas"><div class="label"><span class="swatch" style="background:var(--gas)"></span><span data-i18n="gas"></span> · <span data-i18n="period_total"></span></div><div class="value"><span id="t-gas">—</span><span class="unit" id="t-gas-u">MMscf</span></div><div class="foot" id="t-gas-f"></div></div>
  <div class="card kpi acc"><div class="label" data-i18n="lambda_txt"></div><div class="value"><span id="lam">—</span></div><div class="foot dim" data-i18n="lambda_note"></div></div>
</section>

<section class="card">
  <div class="card-h"><h3 id="v-title"></h3><span class="sub" data-i18n="vfm_chart_sub"></span>
    <div class="right range-bar">
      <label><span data-i18n="rng_from"></span><input type="date" id="r-from"></label>
      <label><span data-i18n="rng_to"></span><input type="date" id="r-to"></label>
      <div class="seg" id="r-quick"><button data-days="1">1d</button><button data-days="7">7d</button><button data-days="30">30d</button><button data-days="90">90d</button><button data-days="0" data-i18n="rng_all"></button></div>
    </div></div>
  <div class="chart" id="vfm-chart" style="height:420px"></div>
</section>

<section class="card">
  <div class="card-h"><h3 data-i18n="hr_title"></h3><span class="sub" data-i18n="hr_sub"></span>
    <div class="right range-bar"><label><span data-i18n="hr_day"></span><input type="date" id="h-day"></label></div></div>
  <div class="chart" id="hourly-chart" style="height:320px"><div class="skel" style="height:100%"></div></div>
  <div class="kv" id="hourly-kv" style="margin-top:8px"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/vfm.js') }}"></script>{% endblock %}
