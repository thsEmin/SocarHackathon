{% extends "base.html" %}
{% block content %}
<section class="row" style="grid-template-columns: 380px minmax(0,1fr)">
  <div class="card">
    <div class="card-h"><h3 data-i18n="wi_controls"></h3></div>
    <div class="dim" style="font-size:12px;margin:-6px 0 18px" data-i18n="wi_controls_sub"></div>
    <div class="slider">
      <div class="top"><span data-i18n="wi_choke"></span><span class="val" id="v-choke">0</span></div>
      <input type="range" id="s-choke" min="-10" max="10" step="0.5" value="0">
      <div class="dim mono" style="font-size:12px" id="choke-abs"></div>
    </div>
    <div class="slider" style="margin-top:22px">
      <div class="top"><span data-i18n="wi_lift"></span><span class="val" id="v-lift">0</span></div>
      <input type="range" id="s-lift" min="-50" max="50" step="5" value="0">
      <div class="dim mono" style="font-size:12px" id="lift-abs"></div>
    </div>
    <div style="margin-top:22px"><button class="btn ghost" id="reset" data-icon="refresh"><span data-i18n="wi_reset"></span></button></div>
    <div id="notes" class="muted" style="font-size:12.5px;margin-top:16px;display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="row" style="gap:var(--gap)">
    <div class="row cols-3">
      <div class="card kpi oil"><div class="label"><span class="swatch" style="background:var(--oil)"></span><span data-i18n="oil"></span></div><div class="value"><span id="n-oil">—</span><span class="unit" data-i18n="stbd"></span></div><div class="foot" id="d-oil"></div></div>
      <div class="card kpi water"><div class="label"><span class="swatch" style="background:var(--water)"></span><span data-i18n="water"></span></div><div class="value"><span id="n-water">—</span><span class="unit" data-i18n="stbd"></span></div><div class="foot" id="d-water"></div></div>
      <div class="card kpi gas"><div class="label"><span class="swatch" style="background:var(--gas)"></span><span data-i18n="gas"></span></div><div class="value"><span id="n-gas">—</span><span class="unit" data-i18n="mscfd"></span></div><div class="foot" id="d-gas"></div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3 data-i18n="wi_chain"></h3></div>
      <div class="chain" id="chain"></div>
    </div>
    <div class="card">
      <div class="card-h"><h3 data-i18n="wi_effects"></h3></div>
      <div class="chart short" id="c-wf"></div>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/whatif.js') }}"></script>{% endblock %}
